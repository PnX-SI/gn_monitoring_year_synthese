<div class="map-container card">
  <div class="map-header d-flex justify-content-between align-items-center">
    <h5>{{ pageConfig?.page_label || pageConfig?.page_code }}</h5>
    <div class="d-flex align-items-center">
      <mys-year-selector
        [years]="years"
        [selectedYear]="selectedYear"
        (yearChange)="onYearChange($event)"
      ></mys-year-selector>
      <a
        *ngIf="hasVisitExport"
        mat-mini-fab
        color="primary"
        class="header-download-fab"
        disableRipple="true"
        matTooltip="Télécharger toutes les visites de l'année"
        (click)="downloadAllVisits()"
      >
        <mat-icon>file_download</mat-icon>
      </a>
    </div>
  </div>

  <div class="loading-overlay" *ngIf="loading">
    <mat-spinner diameter="48"></mat-spinner>
  </div>

  <div class="map-body">
    <div class="site-panel">
      <!-- Un onglet par sous-module de la page. -->
      <mat-tab-group class="site-tabs">
        <mat-tab class="mb-2" *ngFor="let moduleConfig of pageConfig?.modules">
          <ng-template mat-tab-label>
            <span class="tab-label">{{ moduleConfig.module_label || moduleConfig.module_code }}</span>
            <a *ngIf="moduleConfig.dispay_add_button"
              mat-mini-fab
              color="primary"
              class="tab-add-fab"
              disableRipple="true"
              [routerLink]="['/monitorings', 'object', moduleConfig.module_code, 'site', 'create']"
              [queryParams]="{ parents_path: 'module' }"
              [matTooltip]="
                'Ajouter un site ' + (moduleConfig.module_label || moduleConfig.module_code)
              "
              (click)="$event.stopPropagation()"
            >
              <mat-icon>add</mat-icon>
            </a>
            <a
              mat-mini-fab
              color="primary"
              class="tab-download-fab"
              disableRipple="true"
              [matTooltip]="
                'Télécharger les sites ' + (moduleConfig.module_label || moduleConfig.module_code)
              "
              (click)="$event.stopPropagation(); downloadModuleSites(moduleConfig)"
            >
              <mat-icon>file_download</mat-icon>
            </a>
          </ng-template>
          <mys-site-list
            [moduleConfig]="moduleConfig"
            [sites]="sitesByModuleCode[moduleConfig.module_code]"
            [selectedSiteId]="selectedSiteId"
            (siteClick)="selectSite($event)"
          ></mys-site-list>
        </mat-tab>
      </mat-tab-group>
    </div>

    <div class="map-canvas">
      <pnx-map height="100%" [zoom]="6">
        <pnx-geojson
          *ngIf="geojsonSites"
          [geojson]="geojsonSites"
          [onEachFeature]="onEachSiteFeature"
          [zoomOnFirstTime]="true"
        ></pnx-geojson>
      </pnx-map>

      <!-- Une légende par sous-module : les legend_values ne sont pas les mêmes d'un sous-module à l'autre. -->
      <div class="legend">
        <div class="legend-group" *ngFor="let moduleConfig of pageConfig?.modules">
          <div class="legend-title">
            {{ moduleConfig.module_label || moduleConfig.module_code }}
          </div>
          <div class="legend-item" *ngFor="let value of moduleConfig.legend_values">
            <span
              class="legend-swatch"
              [style.backgroundColor]="moduleConfig.site_geom_type === 'point' ? null : value.color"
              [style.borderColor]="moduleConfig.site_geom_type === 'point' ? value.color : null"
            ></span>
            {{ value.label }}
          </div>
        </div>
      </div>
    </div>

    <mys-visit-panel
      class="visit-panel-container"
      [site]="selectedSite"
      [moduleConfig]="selectedModuleConfig"
      [selectedYear]="selectedYear"
    ></mys-visit-panel>
  </div>
</div>
