<div class="year-selector">
  <label for="repro-year-select">Année</label>
  <select
    id="repro-year-select"
    class="form-control"
    [ngModel]="selectedYear"
    (ngModelChange)="onChange($event)"
  >
    <option *ngFor="let year of years" [ngValue]="year">{{ year }}</option>
  </select>
</div>
