<div class="visit-panel">
  <ng-container *ngIf="site; else noSite">
    <div class="visit-panel-header">
      <div>
        <h6 class="visit-panel-title">{{ site.base_site_name }}</h6>
        <p class="text-muted visit-panel-module">{{ site.module_label }}</p>
      </div>
      <div class="visit-panel-header-actions">
        <a *ngIf="moduleConfig.dispay_add_button"
          mat-mini-fab
          color="primary"
          class="visit-panel-add-fab"
          disableRipple="true"
          [routerLink]="['/monitorings', 'create_object', site.module_code, 'visit']"
          [queryParams]="{ id_base_site: site.id_base_site, parents_path: 'site' }"
          matTooltip="Ajouter une visite"
        >
          <mat-icon>add</mat-icon>
        </a>
        <a
          *ngIf="moduleConfig?.visit_export_name"
          mat-mini-fab
          color="primary"
          class="visit-panel-download-fab"
          disableRipple="true"
          target="_blank"
          matTooltip="Télécharger les visites du site"
          (click)="downloadSiteVisits()"
        >
          <mat-icon>file_download</mat-icon>
        </a>
      </div>
    </div>

    <mat-accordion *ngIf="site.visites?.length; else noVisit" class="visit-panel-list">
      <mat-expansion-panel *ngFor="let visite of sortedVisites">
        <mat-expansion-panel-header class="mr-3">
          <span class="panel-title">{{ visitLabel(visite) }}</span>
          <a
            class="visit-panel-info-link"
            [routerLink]="[
              '/monitorings',
              'object',
              visite.module_code || site.module_code,
              'visit',
              visite.id_base_visit
            ]"
            target="_blank"
            (click)="$event.stopPropagation()"
            title="Voir la fiche de la visite"
          >
            <mat-icon color="primary">info</mat-icon>
          </a>
        </mat-expansion-panel-header>

        <div class="visit-panel-field" *ngFor="let field of genericFields(visite)">
          <span class="visit-panel-field-label">{{ field.key  | titlecase}}</span>
          <span class="visit-panel-field-value">{{ field.value }}</span>
        </div>

        <div class="visit-panel-field" *additionalFields="let field of additionalData(visite)">
          <span class="visit-panel-field-label">{{ field.label | titlecase }}</span>
          <span class="visit-panel-field-value">{{ field.value }}</span>
        </div>
      </mat-expansion-panel>
    </mat-accordion>
    <ng-template #noVisit>
      <p class="text-muted">Aucun contrôle cette année</p>
    </ng-template>
  </ng-container>

  <ng-template #noSite>
    <p class="text-muted visit-panel-empty">Cliquez sur un site pour voir ses contrôles</p>
  </ng-template>
</div>
